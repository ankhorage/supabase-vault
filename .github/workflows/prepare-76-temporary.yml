name: Temporary #76 preparation

on:
  push:
    branches:
      - fix/76-fresh-infra-bootstrap

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout task branch
        uses: actions/checkout@v4
        with:
          ref: fix/76-fresh-infra-bootstrap
          fetch-depth: 0
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.2'
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Regenerate documentation
        run: bun run docs
      - name: Format repository
        run: bun run format
      - name: Commit generated changes
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No generated changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "docs(supabase-vault): refresh generated documentation"
          git push origin HEAD:fix/76-fresh-infra-bootstrap
      - name: Build
        run: bun run build
      - name: Check types
        run: bun run check-types
      - name: Lint
        run: bun run lint
      - name: Knip
        run: bun run knip:test
      - name: Changeset status
        run: bun run changeset:status
      - name: Format check
        run: bun run format:check
      - name: Tests
        run: bun run test
