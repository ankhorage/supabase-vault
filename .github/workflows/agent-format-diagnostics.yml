name: Agent Format

on:
  push:
    branches:
      - agent/phase2-supabase-vault

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/phase2-supabase-vault
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.13"
      - run: bun install --frozen-lockfile
      - run: bun run format
      - name: Stage formatted output
        run: |
          mkdir -p formatted-workflows
          cp .github/workflows/ci.yml formatted-workflows/ci.yml.txt
          cp .github/workflows/release.yml formatted-workflows/release.yml.txt
          git restore .github/workflows
          rm -f format-output.txt
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "chore: format repository"
          git push origin HEAD:agent/phase2-supabase-vault
