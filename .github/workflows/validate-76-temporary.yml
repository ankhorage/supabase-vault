name: Temporary #76 Vault schema validation

on:
  push:
    branches:
      - fix/76-vault-extension-schema

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout task branch
        uses: actions/checkout@v4
        with:
          ref: fix/76-vault-extension-schema
          fetch-depth: 0
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.2'
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Build
        run: bun run build
      - name: Check types
        run: bun run check-types
      - name: Lint
        run: bun run lint
      - name: Knip
        run: bun run knip:test
      - name: Changeset status
        run: bun run changeset:status
      - name: Format
        run: bun run format
      - name: Generate docs
        run: bun run docs
      - name: Format generated docs
        run: bun run format
      - name: Commit generated outputs
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No generated changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore(supabase-vault): regenerate Vault schema docs"
          git push origin HEAD:fix/76-vault-extension-schema
      - name: Tests
        run: bun run test
      - name: Format check
        run: bun run format:check
