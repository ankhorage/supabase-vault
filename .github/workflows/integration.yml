name: Integration

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  supabase-vault:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.13'

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v3
        with:
          version: 2.84.2

      - name: Initialize integration project
        run: |
          mkdir -p .integration-supabase
          cd .integration-supabase
          supabase init

      - name: Materialize canonical migration
        run: bun scripts/write-integration-migration.ts .integration-supabase

      - name: Start fresh local database and apply migration
        working-directory: .integration-supabase
        run: supabase db start

      - name: Exercise Vault operations and role boundaries
        env:
          PGHOST: 127.0.0.1
          PGPORT: '54322'
          PGDATABASE: postgres
          PGUSER: postgres
          PGPASSWORD: postgres
        run: |
          SECRET_VALUE="$(openssl rand -hex 32)"
          export SECRET_VALUE

          psql -v ON_ERROR_STOP=1 --set=secret="$SECRET_VALUE" <<'SQL'
          select set_config('ankh.test_secret', :'secret', false);

          set role service_role;

          select public.ankh_secret_create(
            'integration-project',
            'ci',
            'auth/oauth/google',
            'oauth',
            'google',
            jsonb_build_object(
              'clientId',
              'integration-client-id',
              'clientSecret',
              current_setting('ankh.test_secret')
            )
          );

          do $$
          declare
            resolved jsonb;
          begin
            resolved := public.ankh_secret_resolve(
              'integration-project',
              'ci',
              'auth/oauth/google'
            );

            if resolved ->> 'clientSecret' <> current_setting('ankh.test_secret') then
              raise exception 'resolved secret did not match submitted value';
            end if;
          end;
          $$;

          select public.ankh_secret_replace(
            'integration-project',
            'ci',
            'auth/oauth/google',
            jsonb_build_object(
              'clientId',
              'replacement-client-id',
              'clientSecret',
              current_setting('ankh.test_secret')
            )
          );

          do $$
          begin
            if has_function_privilege(
              'anon',
              'public.ankh_secret_resolve(text,text,text)',
              'EXECUTE'
            ) then
              raise exception 'anon role must not resolve secrets';
            end if;

            if has_function_privilege(
              'authenticated',
              'public.ankh_secret_resolve(text,text,text)',
              'EXECUTE'
            ) then
              raise exception 'authenticated role must not resolve secrets';
            end if;
          end;
          $$;

          select public.ankh_secret_remove(
            'integration-project',
            'ci',
            'auth/oauth/google'
          );

          do $$
          begin
            if exists (
              select 1
              from ankh_private.secret_metadata
              where project_id = 'integration-project'
                and environment = 'ci'
                and secret_ref = 'auth/oauth/google'
            ) then
              raise exception 'secret metadata remained after removal';
            end if;
          end;
          $$;
          SQL

          if grep -R --fixed-strings "$SECRET_VALUE" . \
            --exclude-dir=.git \
            --exclude-dir=node_modules \
            --exclude-dir=.integration-supabase; then
            echo 'Resolved secret leaked into a tracked or generated artifact.' >&2
            exit 1
          fi

      - name: Stop local Supabase
        if: always()
        working-directory: .integration-supabase
        run: supabase stop --no-backup
