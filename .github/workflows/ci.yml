name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0
      - run: bun install
      - run: bun run build
      - run: bun run typecheck
      - run: bun run lint
      - run: bun run test
      - run: bun run knip
      - run: bun run format:check
      - run: bun run docs
