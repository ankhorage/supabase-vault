name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.13
      - run: bun install
      - name: Capture lint diagnostics
        id: lint
        shell: bash
        run: |
          set +e
          bun run lint > lint.log 2>&1
          status=$?
          echo "status=$status" >> "$GITHUB_OUTPUT"
          exit 0
      - uses: actions/upload-artifact@v4
        with:
          name: lint-diagnostics
          path: lint.log
      - name: Fail when lint failed
        if: steps.lint.outputs.status != '0'
        run: exit 1
