name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.13'

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Capture lint diagnostics
        run: bun run lint > lint-output.txt 2>&1 || true

      - name: Commit diagnostics
        if: github.event_name == 'pull_request' && github.actor != 'github-actions[bot]'
        run: |
          git restore .github/workflows
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add lint-output.txt
          git commit -m "ci: capture lint diagnostics"
          git push origin HEAD:${{ github.head_ref }}
