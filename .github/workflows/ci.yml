name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.13'

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Apply canonical lint and format fixes
        run: |
          bun run lint:fix
          bun run format

      - name: Validate fixed source
        run: |
          bun run build
          bun run typecheck
          bun run lint
          bun run format:check
          bun run test
          bun run knip
          bun run docs

      - name: Commit canonical fixes
        if: github.event_name == 'pull_request' && github.actor != 'github-actions[bot]'
        run: |
          git restore .github/workflows
          rm -f lint-output.txt
          if git diff --quiet && [ -z "$(git ls-files --others --exclude-standard)" ]; then
            exit 0
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "chore: apply canonical package fixes"
          git push origin HEAD:${{ github.head_ref }}
