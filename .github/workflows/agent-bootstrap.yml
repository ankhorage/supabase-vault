name: Agent Bootstrap

on:
  push:
    branches:
      - agent/phase2-supabase-vault

permissions:
  contents: write

jobs:
  bootstrap:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/phase2-supabase-vault
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.13'
      - run: bun install
      - run: bun run lint:fix
      - run: bun run format
      - run: bun run build
      - run: bun run typecheck
      - run: bun run test
      - name: Commit lockfile and canonical fixes
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "chore: bootstrap package"
          git push origin HEAD:agent/phase2-supabase-vault
